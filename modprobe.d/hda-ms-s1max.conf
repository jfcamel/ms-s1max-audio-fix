# Minisforum MS-S1 MAX (Strix Halo): BIOS pin defaults are wrong.
# Real jacks are wired to 0x17 (HP out) / 0x18 (mic sense+audio?) / possibly 0x19.
# BIOS-claimed pins 0x21/0x19-as-primary/0x12 are not wired (floating -> garbage capture).
# Patch applies correct pin configs at codec probe. See /lib/firmware/hda-ms-s1max.fw
options snd-hda-intel patch=hda-ms-s1max.fw,hda-ms-s1max.fw
